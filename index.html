<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Red Rangers — Committee &amp; Squad Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rr-black: #0a0908;
        --rr-black-2: #151110;
        --rr-crimson-deep: #5c0d10;
        --rr-crimson: #9c1418;
        --rr-crimson-bright: #e0202c;
        --rr-gold: #cda434;
        --rr-gold-light: #f2d98a;
        --rr-white: #f6f3ec;
        --rr-smoke: rgba(246, 243, 236, 0.62);
        --ease-out: cubic-bezier(0.16, 0.84, 0.44, 1);
        --ease-io: cubic-bezier(0.4, 0, 0.2, 1);
        --wipe-dur: 560ms;
      }
      #muteBtn .ic-muted {
        display: none;
      }
      #muteBtn.muted .ic-unmuted {
        display: none;
      }
      #muteBtn.muted .ic-muted {
        display: inline;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--rr-black);
        color: var(--rr-white);
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Barlow Condensed", sans-serif;
        height: 100dvh;
        width: 100vw;
        position: relative;
      }
      img {
        -webkit-user-drag: none;
        pointer-events: none;
      }
      button {
        font-family: inherit;
      }
      .anton {
        font-family: "Anton", sans-serif;
      }

      /* ---------- app shell ---------- */
      #app {
        position: fixed;
        inset: 0;
      }

      .progress-rail {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        z-index: 60;
      }
      .progress-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(
          90deg,
          var(--rr-crimson-bright),
          var(--rr-gold)
        );
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.5s var(--ease-io);
      }

      .wipe {
        position: fixed;
        inset: 0;
        z-index: 55;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(
          115deg,
          transparent 44%,
          var(--rr-crimson-bright) 48%,
          var(--rr-gold) 50%,
          var(--rr-crimson-bright) 52%,
          transparent 56%
        );
        transform: translateX(-130%);
      }
      .wipe.active {
        animation: wipeSweep var(--wipe-dur) var(--ease-io);
      }
      @keyframes wipeSweep {
        0% {
          transform: translateX(-130%);
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        50% {
          transform: translateX(0%);
        }
        92% {
          opacity: 1;
        }
        100% {
          transform: translateX(130%);
          opacity: 0;
        }
      }

      .deck {
        position: fixed;
        inset: 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.035);
        transition:
          opacity 0.5s var(--ease-io),
          transform 0.6s var(--ease-io);
        pointer-events: none;
        will-change: opacity, transform;
        z-index: 1;
      }
      .slide.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
        z-index: 3;
      }

      /* ---------- top chrome ---------- */
      .top-chrome {
        position: fixed;
        top: 24px;
        left: 26px;
        right: 26px;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s var(--ease-io) 0.1s;
      }
      .top-chrome.show {
        opacity: 1;
      }
      .brand-mini {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand-mini .mark {
        width: 26px;
        height: 26px;
        border: 1px solid var(--rr-gold);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        font-size: 11px;
        letter-spacing: 0.02em;
        color: var(--rr-gold-light);
      }
      .brand-mini .word {
        font-size: 13px;
        letter-spacing: 0.16em;
        color: var(--rr-smoke);
        text-transform: uppercase;
      }
      .counter {
        font-size: 13px;
        letter-spacing: 0.12em;
        color: var(--rr-smoke);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- dot nav ---------- */
      .dotnav {
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 11px;
        z-index: 40;
        opacity: 0;
        transition: opacity 0.5s var(--ease-io) 0.15s;
      }
      .dotnav.show {
        opacity: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.26);
        border: none;
        cursor: pointer;
        padding: 0;
        transition:
          background 0.25s var(--ease-io),
          transform 0.25s var(--ease-io);
      }
      .dot.active {
        background: var(--rr-gold);
        transform: scale(1.5);
      }
      .dot:focus-visible {
        outline: 2px solid var(--rr-gold-light);
        outline-offset: 3px;
      }
      .dot:hover {
        background: var(--rr-gold-light);
      }

      /* ---------- bottom controls ---------- */
      .controls {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 14px;
        opacity: 0;
        transition: opacity 0.5s var(--ease-io) 0.15s;
      }
      .controls.show {
        opacity: 1;
      }
      .ctrl-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--rr-white);
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.25s,
          border-color 0.25s,
          transform 0.2s;
      }
      .ctrl-btn:hover {
        background: rgba(205, 164, 52, 0.18);
        border-color: var(--rr-gold);
        transform: translateY(-1px);
      }
      .ctrl-btn:active {
        transform: translateY(0) scale(0.94);
      }
      .ctrl-btn:focus-visible {
        outline: 2px solid var(--rr-gold-light);
        outline-offset: 2px;
      }
      #playBtn.playing .ic-play {
        display: none;
      }
      #playBtn:not(.playing) .ic-pause {
        display: none;
      }

      .kbhint {
        position: fixed;
        bottom: 26px;
        left: 26px;
        z-index: 40;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--rr-smoke);
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.5s var(--ease-io) 0.2s;
      }
      .kbhint.show {
        opacity: 0.65;
      }
      @media (hover: none), (max-width: 720px) {
        .kbhint {
          display: none;
        }
      }

      /* ---------- member slide (full image, nothing cropped) ---------- */
      .m-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 2.4vh, 22px);
        padding: clamp(70px, 10vh, 110px) 24px clamp(64px, 9vh, 96px);
      }
      .m-bg .backdrop {
        position: absolute;
        inset: -6%;
        width: 112%;
        height: 112%;
        object-fit: cover;
        filter: blur(56px) brightness(0.42) saturate(1.15);
        transform: scale(1);
        transform-origin: center;
        z-index: 0;
      }
      .slide.active .m-bg .backdrop {
        animation: kenburns 9s var(--ease-out) forwards;
      }
      @keyframes kenburns {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.08);
        }
      }
      .m-bg .scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0.55) 78%,
          rgba(0, 0, 0, 0.8) 100%
        );
      }
      .m-fg {
        position: relative;
        z-index: 2;
        display: block;
        max-height: min(78vh, 720px);
        max-width: min(90vw, 560px);
        width: auto;
        height: auto;
        border-radius: 10px;
        object-fit: contain;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(205, 164, 52, 0.4),
          0 0 46px rgba(205, 164, 52, 0.14);
        opacity: 0;
        transform: translateY(14px) scale(0.985);
        transition:
          opacity 0.6s var(--ease-out) 0.05s,
          transform 0.6s var(--ease-out) 0.05s;
      }
      .slide.active .m-fg {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .m-caption {
        position: relative;
        z-index: 2;
        text-align: center;
      }
      .m-tag {
        font-size: 12.5px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--rr-gold-light);
        opacity: 0.9;
      }
      .m-rule {
        display: inline-block;
        width: 26px;
        height: 1px;
        background: var(--rr-gold);
        margin: 0 10px;
        vertical-align: middle;
        opacity: 0.6;
      }

      /* ---------- cover / players / outro / section shared bg ---------- */
      .cover,
      .outro,
      .players,
      .section {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 50% 38%,
            #2b0709 0%,
            #140506 42%,
            #08070a 78%
          ),
          linear-gradient(180deg, #000 0%, #0a0908 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .beam {
        position: absolute;
        inset: -20%;
        z-index: 0;
        opacity: 0.5;
        background: conic-gradient(
          from 200deg at 50% 20%,
          transparent 0deg,
          rgba(205, 164, 52, 0.1) 30deg,
          transparent 70deg,
          transparent 300deg,
          rgba(224, 32, 44, 0.08) 340deg,
          transparent 360deg
        );
        animation: beamTurn 34s linear infinite;
      }
      @keyframes beamTurn {
        to {
          transform: rotate(360deg);
        }
      }
      .particle {
        position: absolute;
        bottom: -10px;
        left: var(--x);
        background: var(--rr-gold-light);
        border-radius: 50%;
        opacity: 0;
        animation: floatUp var(--dur) linear var(--delay) infinite;
        z-index: 1;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        12% {
          opacity: 0.85;
        }
        88% {
          opacity: 0.25;
        }
        100% {
          transform: translateY(-100vh);
          opacity: 0;
        }
      }

      .cover-inner,
      .outro-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
      }

      .medallion-wrap {
        width: clamp(150px, 24vw, 240px);
        height: clamp(150px, 24vw, 240px);
        position: relative;
        margin-bottom: clamp(22px, 4vh, 40px);
      }
      .m-ring {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1.5px solid var(--rr-gold);
        opacity: 0.55;
        animation: spin 20s linear infinite;
      }
      .m-ring.outer {
        inset: -27px;
        border-style: dashed;
        opacity: 0.32;
        animation-duration: 30s;
        animation-direction: reverse;
      }
      .medallion-plate {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: radial-gradient(
          circle at 35% 28%,
          #fff 0%,
          #eee 55%,
          #d8d8d8 100%
        );
        box-shadow:
          0 0 0 6px rgba(205, 164, 52, 0.22),
          0 22px 60px rgba(0, 0, 0, 0.65),
          inset 0 0 26px rgba(0, 0, 0, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0.5);
        opacity: 0;
        animation: plateIn 900ms var(--ease-out) 260ms forwards;
      }
      .medallion-plate img {
        width: 80%;
        height: 80%;
        object-fit: contain;
      }
      .shine {
        position: absolute;
        top: 0;
        left: -60%;
        width: 38%;
        height: 100%;
        z-index: 3;
        background: linear-gradient(
          75deg,
          transparent,
          rgba(255, 255, 255, 0.9),
          transparent
        );
        transform: skewX(-20deg);
        animation: shineSweep 2400ms ease-in-out 1150ms 1;
      }
      @keyframes plateIn {
        0% {
          transform: scale(0.5) rotate(-10deg);
          opacity: 0;
        }
        62% {
          transform: scale(1.06) rotate(2deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }
      @keyframes shineSweep {
        0% {
          left: -60%;
        }
        100% {
          left: 130%;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .eyebrow {
        font-size: clamp(11px, 1.6vw, 13px);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--rr-gold-light);
        opacity: 0;
        transform: translateY(12px);
        animation: riseIn 700ms var(--ease-out) 650ms forwards;
        margin-bottom: 0.6em;
      }
      .big-title {
        font-family: "Anton", sans-serif;
        font-size: clamp(2.6rem, 10vw, 6.4rem);
        line-height: 0.94;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--rr-white);
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.5);
        opacity: 0;
        animation: settleIn 850ms var(--ease-out) 760ms forwards;
      }
      .big-title span {
        display: block;
        background: linear-gradient(
          180deg,
          var(--rr-white) 45%,
          var(--rr-gold-light) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tagline {
        margin-top: clamp(14px, 2.4vh, 22px);
        font-size: clamp(13px, 2vw, 16px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--rr-smoke);
        opacity: 0;
        transform: translateY(10px);
        animation: riseIn 700ms var(--ease-out) 1000ms forwards;
        max-width: 560px;
      }
      @keyframes riseIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes settleIn {
        0% {
          opacity: 0;
          letter-spacing: 0.5em;
          transform: translateY(16px);
        }
        100% {
          opacity: 1;
          letter-spacing: 0.02em;
          transform: translateY(0);
        }
      }

      .enter-cta {
        margin-top: clamp(30px, 5vh, 52px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: none;
        border: none;
        color: var(--rr-white);
        cursor: pointer;
        opacity: 0;
        animation: riseIn 700ms var(--ease-out) 1250ms forwards;
      }
      .enter-cta .ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          border-color 0.25s,
          background 0.25s;
        animation: pulseRing 2.4s ease-in-out infinite;
      }
      .enter-cta:hover .ring {
        border-color: var(--rr-gold);
        background: rgba(205, 164, 52, 0.12);
      }
      @keyframes pulseRing {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      .enter-cta .lbl {
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--rr-smoke);
      }
      .chev {
        width: 10px;
        height: 10px;
        border-right: 2px solid var(--rr-gold-light);
        border-bottom: 2px solid var(--rr-gold-light);
        transform: rotate(45deg) translateY(-2px);
      }

      /* ---------- section intro (committee / squad title cards) ---------- */
      .section-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        max-width: 640px;
      }
      .section-badge {
        width: clamp(60px, 9vw, 84px);
        height: clamp(60px, 9vw, 84px);
        border-radius: 50%;
        border: 1.5px solid var(--rr-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: clamp(18px, 3vh, 28px);
        background: rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: scale(0.5);
        animation: plateIn 900ms var(--ease-out) 260ms forwards;
      }
      .section-badge svg {
        width: 44%;
        height: 44%;
      }
      .section-list {
        margin-top: clamp(24px, 4vh, 38px);
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        max-width: 400px;
        max-height: 38vh;
        overflow-y: auto;
        opacity: 0;
        transform: translateY(10px);
        animation: riseIn 700ms var(--ease-out) 1000ms forwards;
      }
      .section-list::-webkit-scrollbar {
        width: 5px;
      }
      .section-list::-webkit-scrollbar-thumb {
        background: rgba(205, 164, 52, 0.4);
        border-radius: 3px;
      }
      .section-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        padding: 9px 2px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .section-row .nm {
        font-family: "Anton", sans-serif;
        font-size: 14.5px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--rr-white);
        text-align: left;
      }
      .section-row .rl {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--rr-smoke);
        text-align: right;
        white-space: nowrap;
      }
      .section-count {
        margin-top: clamp(18px, 3vh, 28px);
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--rr-gold-light);
        opacity: 0;
        animation: riseIn 700ms var(--ease-out) 1150ms forwards;
      }

      /* ---------- players ---------- */
      .squad-card {
        position: relative;
        z-index: 2;
        border: 1.5px dashed rgba(205, 164, 52, 0.45);
        border-radius: 14px;
        padding: clamp(34px, 6vh, 56px) clamp(30px, 6vw, 64px);
        background: rgba(255, 255, 255, 0.02);
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 560px;
      }
      .jersey {
        width: 56px;
        height: 56px;
        margin-bottom: 18px;
        opacity: 0.85;
      }
      .squad-sub {
        margin-top: 12px;
        font-size: 15px;
        color: var(--rr-smoke);
        line-height: 1.5;
        max-width: 420px;
      }

      .squad-grid-wrap {
        position: relative;
        z-index: 2;
        width: min(1100px, 92vw);
        max-height: 80vh;
        overflow-y: auto;
        padding: 6px 4px 20px;
      }
      .squad-grid-wrap::-webkit-scrollbar {
        width: 6px;
      }
      .squad-grid-wrap::-webkit-scrollbar-thumb {
        background: rgba(205, 164, 52, 0.4);
        border-radius: 3px;
      }
      .squad-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 18px;
        margin-top: 26px;
      }
      .player-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .player-photo {
        position: relative;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow:
          0 0 0 2px rgba(205, 164, 52, 0.5),
          0 10px 24px rgba(0, 0, 0, 0.5);
        background: #1a1614;
      }
      .player-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .player-number {
        position: absolute;
        bottom: -4px;
        right: -4px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--rr-gold);
        color: #160f05;
        font-family: "Anton", sans-serif;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }
      .player-name {
        font-family: "Anton", sans-serif;
        font-size: 15px;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.1;
      }
      .player-pos {
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--rr-smoke);
      }

      /* ---------- outro ---------- */
      .outro-logo {
        width: clamp(70px, 9vw, 96px);
        height: clamp(70px, 9vw, 96px);
        border-radius: 50%;
        overflow: hidden;
        margin-bottom: 26px;
        background: #fff;
        box-shadow:
          0 0 0 4px rgba(205, 164, 52, 0.25),
          0 14px 40px rgba(0, 0, 0, 0.5);
      }
      .outro-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .restart-btn {
        margin-top: 30px;
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid var(--rr-gold);
        background: transparent;
        color: var(--rr-gold-light);
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          background 0.25s,
          color 0.25s;
      }
      .restart-btn:hover {
        background: var(--rr-gold);
        color: #160f05;
      }
      .restart-btn:focus-visible {
        outline: 2px solid var(--rr-gold-light);
        outline-offset: 3px;
      }

      /* ---------- load error ---------- */
      .load-error {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: var(--rr-black);
        padding: 40px;
        z-index: 100;
      }
      .load-error .box {
        max-width: 520px;
      }
      .load-error h2 {
        font-family: "Anton", sans-serif;
        font-size: 1.8rem;
        text-transform: uppercase;
        color: var(--rr-gold-light);
        margin-bottom: 14px;
      }
      .load-error p {
        font-size: 16px;
        color: var(--rr-smoke);
        line-height: 1.5;
        margin-bottom: 10px;
      }
      .load-error code {
        display: inline-block;
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 14px;
        color: var(--rr-gold-light);
      }

      /* ---------- reduced motion ---------- */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 560px) {
        .dotnav {
          right: 12px;
          gap: 8px;
        }
        .top-chrome {
          left: 16px;
          right: 16px;
          top: 16px;
        }
        .m-fg {
          max-height: 66vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="progress-rail">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="wipe" id="wipe"></div>
      <audio id="themeSong" src="theme.mpeg" loop preload="auto"></audio>

      <div class="top-chrome" id="topChrome">
        <div class="brand-mini">
          <span class="mark anton">RR</span
          ><span class="word">Red Rangers</span>
        </div>
        <div class="counter" id="counter">01 / 01</div>
      </div>

      <div class="deck" id="deck"></div>

      <nav class="dotnav" id="dotnav" aria-label="Slide navigation"></nav>

      <div class="kbhint" id="kbhint">← → to navigate</div>

      <div class="controls" id="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous slide">
          ‹
        </button>
        <button class="ctrl-btn" id="playBtn" aria-label="Toggle autoplay">
          <span class="ic-play">▶</span><span class="ic-pause">❚❚</span>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next slide">›</button>
        <button class="ctrl-btn" id="muteBtn" aria-label="Toggle sound">
          <span class="ic-unmuted">🔊</span><span class="ic-muted">🔇</span>
        </button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        async function loadData() {
          // Real fetch of the separate, manually-editable data.json file (see README.md).
          var res = await fetch("data.json", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        }

        function pad(n) {
          return n < 10 ? "0" + n : "" + n;
        }

        function makeParticles(container, count) {
          for (var i = 0; i < count; i++) {
            var p = document.createElement("span");
            p.className = "particle";
            var size = (Math.random() * 3 + 1).toFixed(1);
            p.style.setProperty("--x", Math.random() * 100 + "%");
            p.style.setProperty(
              "--delay",
              (Math.random() * 8).toFixed(2) + "s",
            );
            p.style.setProperty(
              "--dur",
              (6 + Math.random() * 7).toFixed(2) + "s",
            );
            p.style.width = size + "px";
            p.style.height = size + "px";
            container.appendChild(p);
          }
        }

        function buildSlides(data) {
          var committee = data.committee.slice().sort(function (a, b) {
            return a.order - b.order;
          });
          var players = (data.players || []).slice().sort(function (a, b) {
            return (a.order || 0) - (b.order || 0);
          });
          var list = [];
          list.push({ type: "cover", data: data.team });

          // Committee section intro — introduces the group before members drop one by one.
          list.push({
            type: "section",
            data: {
              eyebrow: "Behind The Scenes",
              title: "Meet The<br>Committee",
              subtitle:
                "The people who make it all happen — coming up one by one.",
              icon: "people",
              items: committee.map(function (m) {
                return {
                  name: m.name || m.role,
                  role: m.name ? m.role : m.category,
                };
              }),
            },
          });
          committee.forEach(function (m) {
            list.push({ type: "member", data: m, total: committee.length });
          });

          if (players.length) {
            // Squad section intro — introduces the players before they drop one by one.
            list.push({
              type: "section",
              data: {
                eyebrow: "Next Up",
                title: "Meet The<br>Squad",
                subtitle:
                  "The players wearing the shirt this season — introducing them one by one.",
                icon: "jersey",
                items: players.map(function (p) {
                  return { name: p.name || "Player", role: p.position || "" };
                }),
              },
            });
            players.forEach(function (p, idx) {
              list.push({
                type: "player",
                data: p,
                index: idx + 1,
                total: players.length,
              });
            });
          } else {
            list.push({ type: "players", data: players });
          }

          list.push({ type: "outro", data: data.team });
          return list;
        }

        function playerCardHTML(p) {
          return (
            "" +
            '<div class="player-card">' +
            '<div class="player-photo">' +
            (p.image
              ? '<img src="' + p.image + '" alt="' + (p.name || "Player") + '">'
              : "") +
            (p.number
              ? '<span class="player-number anton">' + p.number + "</span>"
              : "") +
            "</div>" +
            '<span class="player-name anton">' +
            (p.name || "Unnamed") +
            "</span>" +
            (p.position
              ? '<span class="player-pos">' + p.position + "</span>"
              : "") +
            "</div>"
          );
        }

        function renderSlide(slide, i) {
          var el = document.createElement("div");
          el.className = "slide";
          el.dataset.index = i;

          if (slide.type === "cover") {
            var t = slide.data;
            el.innerHTML =
              '<div class="cover">' +
              '<div class="beam"></div><div class="particles"></div>' +
              '<div class="cover-inner">' +
              '<div class="medallion-wrap">' +
              '<div class="m-ring"></div><div class="m-ring outer"></div>' +
              '<div class="medallion-plate"><img src="' +
              t.logo +
              '" alt="Red Rangers crest"><div class="shine"></div></div>' +
              "</div>" +
              '<span class="eyebrow">' +
              t.eyebrow +
              "</span>" +
              '<h1 class="big-title anton"><span>Red</span><span>Rangers</span></h1>' +
              '<p class="tagline">' +
              t.tagline +
              "</p>" +
              '<button class="enter-cta" id="enterBtn" aria-label="Begin presentation">' +
              '<span class="ring"><span class="chev"></span></span>' +
              '<span class="lbl">Enter</span>' +
              "</button>" +
              "</div>" +
              "</div>";
          }

          if (slide.type === "member") {
            var m = slide.data;
            el.innerHTML =
              '<div class="m-bg">' +
              '<img class="backdrop" src="' +
              m.image +
              '" alt="">' +
              '<div class="scrim"></div>' +
              '<img class="m-fg" src="' +
              m.image +
              '" alt="' +
              (m.name || m.role) +
              " — " +
              m.role +
              '">' +
              '<div class="m-caption"><span class="m-tag">' +
              m.category +
              '<span class="m-rule"></span>' +
              pad(m.order) +
              " / " +
              pad(slide.total) +
              "</span></div>" +
              "</div>";
          }

          if (slide.type === "section") {
            var sd = slide.data;
            var icon =
              sd.icon === "jersey"
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="var(--rr-gold-light)" stroke-width="1.4"><path d="M8 3 L4 6 L2 9 L5 11 L6 9 L6 21 L18 21 L18 9 L19 11 L22 9 L20 6 L16 3 L14 5 Q12 6.5 10 5 Z"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="var(--rr-gold-light)" stroke-width="1.4"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5M12 20c0-3 2.2-5 5.5-5s5.5 2 5.5 5"/></svg>';
            el.innerHTML =
              '<div class="section">' +
              '<div class="beam"></div><div class="particles"></div>' +
              '<div class="section-inner">' +
              '<div class="section-badge">' +
              icon +
              "</div>" +
              '<span class="eyebrow">' +
              sd.eyebrow +
              "</span>" +
              '<h2 class="big-title anton" style="font-size:clamp(2rem,7vw,3.6rem)">' +
              sd.title +
              "</h2>" +
              '<p class="tagline" style="max-width:440px;">' +
              sd.subtitle +
              "</p>" +
              '<div class="section-list">' +
              sd.items
                .map(function (it) {
                  return (
                    '<div class="section-row"><span class="nm">' +
                    it.name +
                    '</span><span class="rl">' +
                    (it.role || "") +
                    "</span></div>"
                  );
                })
                .join("") +
              "</div>" +
              '<span class="section-count">' +
              pad(sd.items.length) +
              " Coming Up</span>" +
              "</div>" +
              "</div>";
          }

          if (slide.type === "player") {
            var p = slide.data;
            el.innerHTML =
              '<div class="m-bg">' +
              '<img class="backdrop" src="' +
              p.image +
              '" alt="">' +
              '<div class="scrim"></div>' +
              '<img class="m-fg" src="' +
              p.image +
              '" alt="' +
              (p.name || "Player") +
              '">' +
              '<div class="m-caption"><span class="m-tag">Squad<span class="m-rule"></span>' +
              pad(slide.index) +
              " / " +
              pad(slide.total) +
              "</span></div>" +
              "</div>";
          }

          if (slide.type === "players") {
            var players = slide.data;
            if (players && players.length) {
              el.innerHTML =
                '<div class="players">' +
                '<div class="beam"></div><div class="particles"></div>' +
                '<div class="squad-grid-wrap">' +
                '<div style="text-align:center;position:relative;z-index:2;">' +
                '<span class="eyebrow">The Squad</span>' +
                '<h2 class="big-title anton" style="font-size:clamp(1.8rem,6vw,3rem)">Meet The Team</h2>' +
                "</div>" +
                '<div class="squad-grid">' +
                players.map(playerCardHTML).join("") +
                "</div>" +
                "</div>" +
                "</div>";
            } else {
              el.innerHTML =
                '<div class="players">' +
                '<div class="beam"></div><div class="particles"></div>' +
                '<div class="cover-inner">' +
                '<div class="squad-card">' +
                '<svg class="jersey" viewBox="0 0 24 24" fill="none" stroke="var(--rr-gold-light)" stroke-width="1.4"><path d="M8 3 L4 6 L2 9 L5 11 L6 9 L6 21 L18 21 L18 9 L19 11 L22 9 L20 6 L16 3 L14 5 Q12 6.5 10 5 Z"/></svg>' +
                '<span class="eyebrow">The Squad</span>' +
                '<h2 class="big-title anton" style="font-size:clamp(2rem,7vw,3.6rem)">Lineup<br>Dropping Soon</h2>' +
                '<p class="squad-sub">Add players to the <code style="color:var(--rr-gold-light)">"players"</code> array in data.json — name, number, position, image — and they\'ll appear here automatically.</p>' +
                "</div>" +
                "</div>" +
                "</div>";
            }
          }

          if (slide.type === "outro") {
            var to = slide.data;
            el.innerHTML =
              '<div class="outro">' +
              '<div class="beam"></div><div class="particles"></div>' +
              '<div class="outro-inner">' +
              '<div class="outro-logo"><img src="' +
              to.logo +
              '" alt="Red Rangers crest"></div>' +
              '<span class="eyebrow">' +
              to.eyebrow +
              "</span>" +
              '<h2 class="big-title anton" style="font-size:clamp(2rem,7vw,4rem)">See You<br>On The Pitch</h2>' +
              '<p class="tagline">' +
              to.tagline +
              "</p>" +
              '<button class="restart-btn" id="restartBtn">Watch Again ↺</button>' +
              "</div>" +
              "</div>";
          }

          return el;
        }

        function showLoadError(err) {
          var app = document.getElementById("app");
          app.innerHTML =
            '<div class="load-error"><div class="box">' +
            '<h2 class="anton">Can\'t load data.json</h2>' +
            "<p>This presentation loads its content with <code>fetch()</code>, which browsers block when a page is opened directly as a file.</p>" +
            "<p>Run a tiny local server in this folder, then open the printed address:</p>" +
            "<p><code>python3 -m http.server 8000</code></p>" +
            '<p>...or open the folder with VS Code\'s "Live Server" extension, or upload it to any static web host.</p>' +
            "</div></div>";
          console.error(err);
        }

        async function init() {
          var data;
          try {
            data = await loadData();
          } catch (err) {
            showLoadError(err);
            return;
          }

          var slides = buildSlides(data);
          var deck = document.getElementById("deck");
          var dotnav = document.getElementById("dotnav");
          var progressFill = document.getElementById("progressFill");
          var counter = document.getElementById("counter");
          var topChrome = document.getElementById("topChrome");
          var controls = document.getElementById("controls");
          var kbhint = document.getElementById("kbhint");
          var wipeEl = document.getElementById("wipe");
          var playBtn = document.getElementById("playBtn");
          var prevBtn = document.getElementById("prevBtn");
          var nextBtn = document.getElementById("nextBtn");
          var themeSong = document.getElementById("themeSong");
          var muteBtn = document.getElementById("muteBtn");

          function tryPlayMusic() {
            themeSong.volume = 0.6;
            var p = themeSong.play();
            if (p && p.catch) {
              p.catch(function () {
                // Autoplay blocked — wait for first user interaction, then play.
                var resume = function () {
                  themeSong.play().catch(function () {});
                  document.removeEventListener("click", resume);
                  document.removeEventListener("keydown", resume);
                  document.removeEventListener("touchstart", resume);
                };
                document.addEventListener("click", resume, { once: true });
                document.addEventListener("keydown", resume, { once: true });
                document.addEventListener("touchstart", resume, { once: true });
              });
            }
          }

          function toggleMute() {
            themeSong.muted = !themeSong.muted;
            muteBtn.classList.toggle("muted", themeSong.muted);
          }

          var els = slides.map(function (s, i) {
            var node = renderSlide(s, i);
            deck.appendChild(node);
            return node;
          });
          els[0].classList.add("active");

          els.forEach(function (node) {
            var pc = node.querySelector(".particles");
            if (pc) makeParticles(pc, 14);
          });

          slides.forEach(function (s, i) {
            var d = document.createElement("button");
            d.className = "dot";
            d.setAttribute("aria-label", "Go to slide " + (i + 1));
            if (i === 0) d.classList.add("active");
            d.addEventListener("click", function () {
              stopAutoplay();
              goTo(i);
            });
            dotnav.appendChild(d);
          });
          var dots = Array.prototype.slice.call(dotnav.children);

          var index = 0;
          var total = slides.length;
          var autoplay = false;
          var autoTimer = null;
          var AUTO_MS = 6000;
          var transitioning = false;

          function updateChrome() {
            counter.textContent = pad(index + 1) + " / " + pad(total);
            progressFill.style.transform =
              "scaleX(" + (index + 1) / total + ")";
            dots.forEach(function (d, i) {
              d.classList.toggle("active", i === index);
            });
            topChrome.classList.toggle("show", index !== 0);
            dotnav.classList.add("show");
            controls.classList.add("show");
            kbhint.classList.add("show");
          }

          function restartBackdropZoom(el) {
            var img = el.querySelector(".m-bg .backdrop");
            if (!img) return;
            img.style.animation = "none";
            void img.offsetWidth;
            img.style.animation = "";
          }

          function goTo(newIndex) {
            newIndex = Math.max(0, Math.min(total - 1, newIndex));
            if (newIndex === index || transitioning) return;
            transitioning = true;

            wipeEl.classList.remove("active");
            void wipeEl.offsetWidth;
            wipeEl.classList.add("active");

            setTimeout(function () {
              els[index].classList.remove("active");
              els[newIndex].classList.add("active");
              restartBackdropZoom(els[newIndex]);
              index = newIndex;
              updateChrome();
            }, 260);

            setTimeout(function () {
              transitioning = false;
            }, 620);
          }

          function next() {
            goTo(index === total - 1 ? 0 : index + 1);
          }
          function prev() {
            goTo(index === 0 ? total - 1 : index - 1);
          }

          function startAutoplay() {
            autoplay = true;
            playBtn.classList.add("playing");
            clearInterval(autoTimer);
            autoTimer = setInterval(next, AUTO_MS);
          }
          function stopAutoplay() {
            autoplay = false;
            playBtn.classList.remove("playing");
            clearInterval(autoTimer);
          }
          function toggleAutoplay() {
            autoplay ? stopAutoplay() : startAutoplay();
          }

          nextBtn.addEventListener("click", function () {
            stopAutoplay();
            next();
          });
          prevBtn.addEventListener("click", function () {
            stopAutoplay();
            prev();
          });
          playBtn.addEventListener("click", toggleAutoplay);

          document.addEventListener("click", function (e) {
            if (e.target && e.target.id === "enterBtn") {
              stopAutoplay();
              next();
            }
            if (e.target && e.target.id === "restartBtn") {
              stopAutoplay();
              goTo(0);
            }
          });

          document.addEventListener("keydown", function (e) {
            if (
              ["ArrowRight", "ArrowDown", " ", "Enter"].indexOf(e.key) !== -1
            ) {
              e.preventDefault();
              stopAutoplay();
              next();
            } else if (
              ["ArrowLeft", "ArrowUp", "Backspace"].indexOf(e.key) !== -1
            ) {
              e.preventDefault();
              stopAutoplay();
              prev();
            } else if (e.key === "Home") {
              e.preventDefault();
              stopAutoplay();
              goTo(0);
            } else if (e.key === "End") {
              e.preventDefault();
              stopAutoplay();
              goTo(total - 1);
            }
          });

          var touchX = 0,
            touchY = 0;
          document.addEventListener(
            "touchstart",
            function (e) {
              touchX = e.changedTouches[0].clientX;
              touchY = e.changedTouches[0].clientY;
            },
            { passive: true },
          );
          document.addEventListener(
            "touchend",
            function (e) {
              var dx = e.changedTouches[0].clientX - touchX;
              var dy = e.changedTouches[0].clientY - touchY;
              if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy)) {
                stopAutoplay();
                dx < 0 ? next() : prev();
              }
            },
            { passive: true },
          );
      muteBtn.addEventListener('click', toggleMute);

      restartBackdropZoom(els[0]);
      updateChrome();
      tryPlayMusic();
      startAutoplay();
    }

        document.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
</html>
